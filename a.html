<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parabéns Wesley</title>
        <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff4d4d, #ffcc00, #4da6ff);
        font-family: Arial, sans-serif;
      }
      
      .card {
        width: 600px;
        max-width: 90%;
        background: white;
        border-radius: 25px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }
      
      .card::before,
      .card::after {
        content: "🎉 🎈 🎊";
        position: absolute;
        font-size: 2rem;
      }
      
      .card::before {
        top: 10px;
        left: 20px;
      }
      
      .card::after {
        bottom: 10px;
        right: 20px;
      }
      
      h1 {
        color: #e63946;
        font-size: 3rem;
        margin-bottom: 20px;
        text-transform: uppercase;
      }
      .clown {
        font-size: 8rem;
        margin: 20px 0;
        animation: bounce 1.5s infinite;
      }
      
      p {
        font-size: 1.4rem;
        color: #333;
        font-weight: bold;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
      }
    </style>
  </head>
  <body>
        <div class="card">
      <h1>Parabéns</h1>
            <div class="clown">🤡</div>
            <p>
        Bloqueamos essa automação por motivos de segurança e mantimento da integridade e qualidade do serivço! 🎉
      </p>
    </div>
      </body>
</html>
