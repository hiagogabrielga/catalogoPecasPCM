<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha com IA</title>
     
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #3498db, #8e44ad);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        margin-bottom: 20px;
      }
      .controls {
        margin-bottom: 20px;
      }
      select,
      button {
        padding: 10px;
        border: none;
        border-radius: 8px;
        margin: 5px;
        font-size: 16px;
      }
      button {
        cursor: pointer;
        background: #2ecc71;
        color: white;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 120px);
        grid-template-rows: repeat(3, 120px);
        gap: 5px;
      }
      .cell {
        background: white;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
      }
      .cell:hover {
        background: #f1f1f1;
      }
      .status {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
     
    <h1>🎮 Jogo da Velha com IA</h1>
     
    <div class="controls">
      <label>Dificuldade:</label>
      <select id="difficulty">
        <option value="easy">Fácil</option>
        <option value="medium">Médio</option>
        <option value="hard">Difícil</option>
      </select>
       
      <button onclick="resetGame()">Novo Jogo</button>
    </div>
     
    <div class="board" id="board"></div>
     
    <div class="status" id="status">Sua vez (X)</div>
     
    <script>
      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      let board = ["", "", "", "", "", "", "", "", ""];
      let gameOver = false;
      const HUMAN = "X";
      const AI = "O";
      function createBoard() {
        boardElement.innerHTML = "";
        board.forEach((cell, index) => {
          const div = document.createElement("div");
          div.classList.add("cell");
          div.textContent = cell;
          div.addEventListener("click", () => playerMove(index));
          boardElement.appendChild(div);
        });
      }
      function playerMove(index) {
        if (board[index] !== "" || gameOver) return;
        board[index] = HUMAN;
        createBoard();
        if (checkWinner(board, HUMAN)) {
          finish("🎉 Você venceu!");
          return;
        }
        if (isDraw()) {
          finish("🤝 Empate!");
          return;
        }
        statusElement.innerText = "IA pensando...";
        setTimeout(() => {
          aiMove();
        }, 400);
      }
      function aiMove() {
        if (gameOver) return;
        const difficulty = document.getElementById("difficulty").value;
        let move;
        if (difficulty === "easy") {
          move = randomMove();
        } else if (difficulty === "medium") {
          move = Math.random() < 0.7 ? bestMove() : randomMove();
        } else {
          move = bestMove();
        }
        board[move] = AI;
        createBoard();
        if (checkWinner(board, AI)) {
          finish("🤖 IA venceu!");
          return;
        }
        if (isDraw()) {
          finish("🤝 Empate!");
          return;
        }
        statusElement.innerText = "Sua vez (X)";
      }
      function randomMove() {
        const empty = board
          .map((v, i) => (v === "" ? i : null))
          .filter((v) => v !== null);
        return empty[Math.floor(Math.random() * empty.length)];
      }
      function finish(msg) {
        gameOver = true;
        statusElement.innerText = msg;
      }
      function isDraw() {
        return board.every((cell) => cell !== "");
      }
      function checkWinner(b, p) {
        const wins = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];
        return wins.some((combo) => combo.every((i) => b[i] === p));
      }
      function bestMove() {
        let bestScore = -Infinity;
        let move;
        for (let i = 0; i < 9; i++) {
          if (board[i] === "") {
            board[i] = AI;
            let score = minimax(board, false);
            board[i] = "";
            if (score > bestScore) {
              bestScore = score;
              move = i;
            }
          }
        }
        return move;
      }
      function minimax(b, isMaximizing) {
        if (checkWinner(b, AI)) return 1;
        if (checkWinner(b, HUMAN)) return -1;
        if (b.every((cell) => cell !== "")) return 0;
        if (isMaximizing) {
          let best = -Infinity;
          for (let i = 0; i < 9; i++) {
            if (b[i] === "") {
              b[i] = AI;
              best = Math.max(best, minimax(b, false));
              b[i] = "";
            }
          }
          return best;
        }
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = HUMAN;
            best = Math.min(best, minimax(b, true));
            b[i] = "";
          }
        }
        return best;
      }
      function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        gameOver = false;
        statusElement.innerText = "Sua vez (X)";
        createBoard();
      }
      createBoard();
    </script>
     
  </body>
</html>
